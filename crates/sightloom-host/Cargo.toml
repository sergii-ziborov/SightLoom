[package]
name = "sightloom-host"
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host model package for SightLoom: config, preprocess, adapters, photo→rank pipeline (weights stay host-side)"
readme = "README.md"
documentation = "https://docs.rs/sightloom-host"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["vision", "re-id", "onnx", "host", "embeddings"]
categories = ["computer-vision", "multimedia"]

[features]
default = ["std"]
std = ["sightloom/std"]
# Real ONNX inference via pure-Rust `tract` (portable; no Microsoft ORT prebuilts).
onnx = ["std", "dep:tract-onnx"]
# HTTP(S) download of ModelSpec.uri into the model cache.
download = ["std", "dep:ureq"]
# Decode JPEG/PNG encoded photos into RGB for embedders.
image-decode = ["std", "dep:image"]
# Convenience: onnx + download + image-decode.
full = ["onnx", "download", "image-decode"]

[dependencies]
sightloom = { path = "../sightloom", version = "0.1.6", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Pure-Rust ONNX runner — works on windows-gnu / no ORT dylib download.
tract-onnx = { version = "0.21", optional = true }
ureq = { version = "2.12", optional = true, default-features = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "photo_to_subject"
required-features = ["std"]

[[example]]
name = "onnx_photo_search"
required-features = ["onnx"]

[[example]]
name = "write_evidence_pack"
required-features = ["std"]

[[example]]
name = "weights_cookbook"
required-features = ["std"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Avoid pulling ORT binaries on docs.rs.
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]
