[package]
name = "sightloom-analysis"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Zone analytics, pattern miners, and statistical anomalies for SightLoom"
readme = "README.md"
documentation = "https://docs.rs/sightloom-analysis"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["analytics", "anomaly", "patterns", "zones", "vision"]
categories = ["computer-vision", "algorithms"]

[features]
default = []
alloc = ["sightloom-core/alloc"]
std = ["alloc", "sightloom-core/std"]

[dependencies]
sightloom-core = { path = "../sightloom-core", version = "0.1.4", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]