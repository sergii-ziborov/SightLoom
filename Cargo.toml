[workspace]
members = [
    "crates/sightloom-core",
    "crates/sightloom-mask",
    "crates/sightloom-track",
    "crates/sightloom-smooth",
    "crates/sightloom-obs",
    "crates/sightloom-analytics",
    "crates/sightloom-memory",
    "crates/sightloom",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sergii-ziborov/SightLoom"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
