[package]
name = "sightloom-tracking"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Baseline multi-object tracking, smoothing, and trajectories for SightLoom"
readme = "README.md"
documentation = "https://docs.rs/sightloom-tracking"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["tracking", "bytetrack", "kalman", "vision", "mot"]
categories = ["computer-vision", "algorithms"]

[features]
default = ["alloc"]
alloc = ["sightloom-core/alloc"]
std = ["alloc", "sightloom-core/std"]

[dependencies]
sightloom-core = { path = "../sightloom-core", version = "0.1.0", default-features = false }

[lints]
workspace = true
