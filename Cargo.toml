[workspace]
members = [
    "crates/sightloom-core",
    "crates/sightloom-tracking",
    "crates/sightloom-index",
    "crates/sightloom-analysis",
    "crates/sightloom-reid",
    "crates/sightloom",
    "crates/sightloom-host",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sergii-ziborov/SightLoom"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
