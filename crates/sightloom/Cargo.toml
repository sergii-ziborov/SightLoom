[package]
name = "sightloom"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SightLoom facade: tracking to VisionIndex materialization"

[features]
default = ["std"]
std = [
    "sightloom-core/std",
    "sightloom-tracking/std",
    "sightloom-analysis/std",
    "sightloom-index/std",
    "sightloom-index/package",
    "sightloom-reid/std",
]
sqlite = ["std", "sightloom-index/sqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sightloom-analysis = { path = "../sightloom-analysis", default-features = false }
sightloom-core = { path = "../sightloom-core", default-features = false }
sightloom-index = { path = "../sightloom-index", default-features = false }
sightloom-reid = { path = "../sightloom-reid", default-features = false, features = ["alloc"] }
sightloom-tracking = { path = "../sightloom-tracking", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "host_sketch"
required-features = ["std"]

[lints]
workspace = true
