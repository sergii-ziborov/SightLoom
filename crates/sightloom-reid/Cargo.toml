[package]
name = "sightloom-reid"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Subject gallery, multi-factor re-id, and identity audit for SightLoom"
readme = "README.md"
documentation = "https://docs.rs/sightloom-reid"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["re-id", "identity", "embeddings", "vision", "gallery"]
categories = ["computer-vision", "algorithms"]

[features]
default = ["alloc"]
alloc = ["sightloom-core/alloc"]
std = ["alloc", "sightloom-core/std"]

[dependencies]
sightloom-core = { path = "../sightloom-core", version = "0.1.5", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]