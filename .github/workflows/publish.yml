# Publish crates.io packages when a version tag is pushed (e.g. v0.1.0).
#
# Required GitHub repository secret: CARGO_REGISTRY_TOKEN
# Never commit the token value.

name: Publish crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Require CARGO_REGISTRY_TOKEN secret
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is missing."
            exit 1
          fi

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_one() {
            local crate="$1"
            echo "==== publishing ${crate} ===="
            local attempt=1
            local max=10
            local log
            log="$(mktemp)"
            while true; do
              set +e
              cargo publish -p "${crate}" --locked >"${log}" 2>&1
              local code=$?
              set -e
              cat "${log}"
              if [ "${code}" -eq 0 ]; then
                echo "published ${crate}"
                return 0
              fi
              if grep -qiE 'already exists|already uploaded' "${log}"; then
                echo "${crate} already on crates.io — skipping"
                return 0
              fi
              if [ "${attempt}" -ge "${max}" ]; then
                echo "::error::failed to publish ${crate} after ${max} attempts"
                return 1
              fi
              echo "retry ${attempt}/${max} for ${crate} in 40s..."
              attempt=$((attempt + 1))
              sleep 40
            done
          }

          publish_one sightloom-core
          publish_one sightloom-tracking
          publish_one sightloom-analysis
          publish_one sightloom-reid
          sleep 25
          publish_one sightloom-index
          sleep 25
          publish_one sightloom
