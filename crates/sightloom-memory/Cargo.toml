[package]
name = "sightloom-memory"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Queryable video memory sidecar storage for SightLoom"

[features]
default = ["std"]
std = ["sightloom-core/std", "serde", "serde_json"]

[dependencies]
sightloom-core = { path = "../sightloom-core", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints]
workspace = true
