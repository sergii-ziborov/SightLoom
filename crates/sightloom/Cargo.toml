[package]
name = "sightloom"
version = "0.1.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SightLoom facade: multi-source tracking, re-id, VisionIndex, demo export APIs"
readme = "README.md"
documentation = "https://docs.rs/sightloom"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["vision", "tracking", "re-id", "video", "memory"]
categories = ["computer-vision", "multimedia"]

[features]
default = ["std"]
std = [
    "sightloom-core/std",
    "sightloom-tracking/std",
    "sightloom-analysis/std",
    "sightloom-index/std",
    "sightloom-index/package",
    "sightloom-reid/std",
]
sqlite = ["std", "sightloom-index/sqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sightloom-analysis = { path = "../sightloom-analysis", version = "0.1.7", default-features = false }
sightloom-core = { path = "../sightloom-core", version = "0.1.7", default-features = false }
sightloom-index = { path = "../sightloom-index", version = "0.1.7", default-features = false }
sightloom-reid = { path = "../sightloom-reid", version = "0.1.7", default-features = false, features = ["alloc"] }
sightloom-tracking = { path = "../sightloom-tracking", version = "0.1.7", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "host_sketch"
required-features = ["std"]

[[example]]
name = "host_model_stub"
required-features = ["std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]