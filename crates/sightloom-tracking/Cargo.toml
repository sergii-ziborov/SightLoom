[package]
name = "sightloom-tracking"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Multi-object tracking, smoothing, and trajectories for SightLoom"

[features]
default = ["alloc"]
alloc = ["sightloom-core/alloc"]
std = ["alloc", "sightloom-core/std"]

[dependencies]
sightloom-core = { path = "../sightloom-core", default-features = false }

[lints]
workspace = true
