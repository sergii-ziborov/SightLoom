[package]
name = "sightloom-index"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Observations, masks, events, and VisionIndex storage for SightLoom"

[features]
default = ["std", "package"]
alloc = ["sightloom-core/alloc", "sightloom-analysis/alloc"]
std = ["alloc", "sightloom-core/std", "sightloom-analysis/std", "serde", "serde_json"]
package = ["std", "cbor"]
cbor = ["dep:ciborium"]
sqlite = ["package", "dep:rusqlite"]

[dependencies]
sightloom-analysis = { path = "../sightloom-analysis", default-features = false }
sightloom-core = { path = "../sightloom-core", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
