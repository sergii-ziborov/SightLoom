[package]
name = "sightloom-host"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host model package for SightLoom: config, preprocess, adapters, photo→rank pipeline (weights stay host-side)"
readme = "README.md"
documentation = "https://docs.rs/sightloom-host"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["vision", "re-id", "onnx", "host", "embeddings"]
categories = ["computer-vision", "multimedia"]

[features]
default = ["std"]
std = ["sightloom/std"]
# Reserved for a future ONNX Runtime backend (not linked in step 1).
onnx = ["std"]

[dependencies]
sightloom = { path = "../sightloom", version = "0.1.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "photo_to_subject"
required-features = ["std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
