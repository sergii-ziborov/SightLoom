[package]
name = "sightloom-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable geometry and event core for SightLoom"

[features]
default = []
alloc = []
std = ["alloc"]

[dependencies]

[dev-dependencies]
blazingly-json = "0.1.4"
criterion = "0.8.2"
proptest = "1.11.0"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[[bench]]
name = "core"
harness = false
