[package]
name = "sightloom-core"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable geometry, detections, NMS, zones, and event core for SightLoom"
readme = "README.md"
documentation = "https://docs.rs/sightloom-core"
homepage = "https://github.com/sergii-ziborov/SightLoom"
keywords = ["vision", "geometry", "detection", "nms", "no-std"]
categories = ["computer-vision", "no-std", "data-structures"]

[features]
default = []
alloc = []
std = ["alloc"]

[dependencies]

[dev-dependencies]
blazingly-json = "0.1.4"
criterion = "0.8.2"
proptest = "1.11.0"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[[bench]]
name = "core"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]