# Publish crates.io packages when a version tag is pushed (e.g. v0.1.0).
#
# Required GitHub repository secret (Settings → Secrets and variables → Actions):
#   Name:  CARGO_REGISTRY_TOKEN
# Never commit the token value.

name: Publish crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Require CARGO_REGISTRY_TOKEN secret
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is missing."
            exit 1
          fi

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_one() {
            local crate="$1"
            echo "==== publishing ${crate} ===="
            # Retry a few times for crates.io index lag / transient errors
            local attempt=1
            local max=8
            while true; do
              if cargo publish -p "${crate}" --locked; then
                echo "published ${crate}"
                return 0
              fi
              # Already published is OK on re-run
              if cargo search "${crate}" --limit 1 2>/dev/null | grep -q "^${crate} = "; then
                local ver
                ver="$(cargo search "${crate}" --limit 1 2>/dev/null | head -n1 | sed -n 's/.*"\([^"]*\)".*/\1/p')"
                local want
                want="$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='${crate}'))")"
                if [ "${ver}" = "${want}" ]; then
                  echo "${crate} ${want} already on crates.io — skipping"
                  return 0
                fi
              fi
              if [ "${attempt}" -ge "${max}" ]; then
                echo "::error::failed to publish ${crate} after ${max} attempts"
                return 1
              fi
              echo "retry ${attempt}/${max} for ${crate} in 45s..."
              attempt=$((attempt + 1))
              sleep 45
            done
          }

          publish_one sightloom-core
          publish_one sightloom-tracking
          publish_one sightloom-analysis
          publish_one sightloom-reid
          sleep 20
          publish_one sightloom-index
          sleep 20
          publish_one sightloom
